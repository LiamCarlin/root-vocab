# Builds the web version of the prototype and publishes it to GitHub Pages, so anyone can open it
# in a browser with nothing to install. Runs on every push to main, or by hand from the Actions tab.
#
# One-time setup in the GitHub repo: Settings › Pages › Build and deployment › Source: GitHub Actions.
name: Deploy web prototype

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Export the web build
        run: npx expo export --platform web --output-dir dist
        env:
          # The site lives at https://<owner>.github.io/<repo>/
          EXPO_BASE_URL: /${{ github.event.repository.name }}
      - name: Let deep links and underscore folders work on Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
